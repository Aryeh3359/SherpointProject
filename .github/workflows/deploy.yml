name: CI Infrastructure Validation & App Build

on:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: '3.11'
  RESOURCE_GROUP: 'rg-sherpoint-rag'

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate Bicep Template (IaC Preflight)
        shell: bash
        run: |
          echo "Validating Bicep syntax and deployment template against Azure..."
          az deployment group validate \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file ./infra/main.bicep