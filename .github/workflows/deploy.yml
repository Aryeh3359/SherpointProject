name: CI Infrastructure Validation & App Build

on:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Build and Validate Bicep Template Locally
        shell: bash
        run: |
          echo "Compiling and validating Bicep template syntax..."
          az bicep build --file ./infra/main.bicep